<mat-sidenav-container class="layout-container">

  <mat-sidenav #drawer mode="over" class="nav-sidenav">
    <nav class="nav-sidenav__content">
      <a routerLink="/" (click)="drawer.close()">Zero Waste</a>
      <a routerLink="/features" (click)="drawer.close()">Funkcje</a>
      <a routerLink="/education" (click)="drawer.close()">Edukacja</a>
      <a routerLink="/organizations" (click)="drawer.close()">Organizacje</a>
      <a routerLink="/blog" (click)="drawer.close()">Blog</a>

      <a
        *ngIf="isLoggedIn()"
        routerLink="/wiadomosci"
        (click)="drawer.close()">
        Wiadomości
      </a>

      <a
        *ngIf="isLoggedIn()"
        routerLink="/dodaj-oferte"
        (click)="drawer.close()">
        Dodaj ofertę
      </a>

      <a
        *ngIf="isLoggedIn()"
        routerLink="/my-offers"
        (click)="drawer.close()">
        Moje ogłoszenia
      </a>

      <a
        *ngIf="isLoggedIn()"
        routerLink="/profil"
        (click)="drawer.close()">
        Mój profil
      </a>

      <a
        *ngIf="isLoggedIn()"
        routerLink="/profil/edytuj"
        (click)="drawer.close()">
        Edytuj profil
      </a>

      <ng-container *ngIf="currentUser$ | async as user; else mobileGuestButtons">
        <button
          mat-stroked-button
          type="button"
          (click)="logout(); drawer.close()">
          Wyloguj się
        </button>
      </ng-container>

      <ng-template #mobileGuestButtons>
        <button
          mat-stroked-button
          routerLink="/login"
          type="button"
          (click)="drawer.close()">
          Zaloguj się
        </button>

        <button
          mat-flat-button
          routerLink="/register"
          color="primary"
          class="btn-primary"
          type="button"
          (click)="drawer.close()">
          Dołącz teraz
        </button>
      </ng-template>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="nav-wrapper">
      <mat-toolbar class="nav">
        <a routerLink="/" class="nav__brand">
          <div class="nav__logo">
            <span>0</span>
          </div>
          <span class="nav__brand-text">Zero Waste</span>
        </a>

        <nav class="nav__menu">
          <a
            routerLink="/features"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }">
            Funkcje
          </a>

          <a
            routerLink="/education"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }">
            Edukacja
          </a>

          <a
            routerLink="/organizations"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }">
            Organizacje
          </a>

          <a
            routerLink="/blog"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }">
            Blog
          </a>

          <a
            *ngIf="isLoggedIn()"
            routerLink="/wiadomosci"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }">
            Wiadomości
          </a>

          <a
            *ngIf="isLoggedIn()"
            routerLink="/dodaj-oferte"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }">
            Dodaj ofertę
          </a>

          <a
            *ngIf="isLoggedIn()"
            routerLink="/profil"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }">
            Mój profil
          </a>
        </nav>

        <div class="flex-spacer"></div>

        <div class="nav__search">
          <input
            type="text"
            placeholder="Szukaj profilu..."
            [value]="searchQuery"
            (input)="onSearchInput($event)"
            (blur)="closeSearch()"
          />

          <div class="search-dropdown" *ngIf="searchOpen">
            <div class="search-empty" *ngIf="searching">
              Szukam...
            </div>

            <ng-container *ngIf="!searching">
              <button
                type="button"
                class="search-item"
                *ngFor="let user of searchResults"
                (mousedown)="openProfile(user.id)"
              >
                <div class="search-avatar">
                  <img
                    *ngIf="user.avatar_url; else noAvatar"
                    [src]="'http://127.0.0.1:8000' + user.avatar_url"
                    [alt]="user.username"
                  />

                  <ng-template #noAvatar>
                    👤
                  </ng-template>
                </div>

                <div class="search-meta">
                  <div class="search-name">
                    {{ user.username }}
                  </div>

                  <div class="search-bio" *ngIf="user.bio">
                    {{ user.bio }}
                  </div>
                </div>
              </button>

              <div class="search-empty" *ngIf="searchResults.length === 0">
                Brak wyników
              </div>
            </ng-container>
          </div>
        </div>

        <div class="nav__actions">
          <ng-container *ngIf="currentUser$ | async as user; else desktopGuestButtons">
            <span style="margin-right: 12px;">
              Witaj, {{ user.username }}
            </span>

            <button
              mat-stroked-button
              type="button"
              (click)="logout()">
              Wyloguj się
            </button>
          </ng-container>

          <ng-template #desktopGuestButtons>
            <button
              mat-button
              routerLink="/login"
              type="button">
              Zaloguj się
            </button>

            <button
              mat-flat-button
              routerLink="/register"
              color="primary"
              class="btn-primary"
              type="button">
              Dołącz teraz
            </button>
          </ng-template>
        </div>

        <button
          mat-icon-button
          class="nav__burger"
          type="button"
          (click)="drawer.toggle()"
          aria-label="Otwórz menu"
        >
          <mat-icon>menu</mat-icon>
        </button>
      </mat-toolbar>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
