<div class="offers-header">
  <h2>Oferty</h2>

  <a routerLink="/dodaj-oferte" class="btn-add-offer">
    ➕ Dodaj ofertę
  </a>
</div>

<section class="offers-section">

  <header class="offers-header">
    <div>
      <h2 class="offers-title">Wszystkie oferty</h2>
      <p class="offers-subtitle">
        Najnowsze ogłoszenia od naszej społeczności
      </p>
    </div>
    <a class="offers-link" (click)="resetFilters()">
      Zobacz wszystkie
    </a>
  </header>

  <!-- FILTRY -->
  <section class="offers-filters">
    <div class="offers-filters__group">
      <label class="offers-filters__field">
        <span>Szukaj</span>
        <input
          type="search"
          placeholder="np. krzesło, książki, zabawki..."
          [(ngModel)]="searchTerm"
        />
      </label>

      <label class="offers-filters__field">
        <span>Kategoria</span>
        <select [(ngModel)]="selectedCategory">
          <option value="Wszystkie">Wszystkie</option>
          <option *ngFor="let c of categories" [value]="c.name">{{ c.name }}</option>
        </select>
      </label>

      <label class="offers-filters__field">
        <span>Miasto</span>
        <input
          type="text"
          placeholder="np. Warszawa"
          [(ngModel)]="selectedCity"
        />
      </label>
    </div>

    <div class="offers-filters__chips">
      <button
        type="button"
        class="chip"
        [class.chip--active]="selectedType === 'free'"
        (click)="setType('free')"
      >
        Za darmo
      </button>
      <button
        type="button"
        class="chip"
        [class.chip--active]="selectedType === 'exchange'"
        (click)="setType('exchange')"
      >
        Wymiana
      </button>
      <button
        type="button"
        class="chip"
        [class.chip--active]="selectedType === 'sell'"
        (click)="setType('sell')"
      >
        Sprzedam
      </button>
    </div>
  </section>

  <!-- TOOLBAR NAD LISTĄ: liczba ofert + sortowanie -->
  <section class="offers-toolbar">
    <span class="offers-count">
      {{ filteredItems.length }} ofert
    </span>

    <label class="offers-sort">
      <span>Sortuj:</span>
      <select [(ngModel)]="sortOption">
        <option value="newest">Najnowsze</option>
        <option value="name-asc">Alfabetycznie A–Z</option>
        <option value="name-desc">Alfabetycznie Z–A</option>
      </select>
    </label>
  </section>

  <!-- LISTA OFERT -->
  <section class="offers-grid">
    <app-list-item
      *ngFor="let item of filteredItems"
      [item]="item"
      (click)="goToDetails(item.id)"
    ></app-list-item>
  </section>

  <p
    *ngIf="filteredItems.length === 0"
    class="offers-empty"
  >
    Brak ogłoszeń spełniających wybrane kryteria.
  </p>
</section>
