<div class="auth-simple-container">
  <div class="card">
    <a routerLink="/login" class="back-link">← Powrót do logowania</a>
    <h2>Ustaw nowe hasło</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Nowe hasło</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Powtórz nowe hasło</mat-label>
        <input matInput type="password" formControlName="confirmPassword" />
      </mat-form-field>

      <button mat-raised-button color="primary" class="full" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Zapisywanie...' : 'Zmień hasło' }}
      </button>
    </form>
  </div>
</div>
