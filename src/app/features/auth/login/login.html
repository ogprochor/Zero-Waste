<!-- src/app/features/auth/login/login.html -->
<div class="auth-container">
  <div class="left-panel" aria-hidden="true">
    <div class="overlay"></div>
    <div class="left-content">
      <div class="brand">
        <div class="brand__logo">Zero Waste</div>
      </div>
      <p class="subtitle">Dołącz do społeczności, która daje drugie życie rzeczom!</p>

      <ul class="benefits">
        <li>Ratuj jedzenie i redukuj odpady</li>
        <li>Wspieraj lokalne organizacje</li>
        <li>Zbieraj punkty i nagrody</li>
      </ul>
    </div>
  </div>

  <div class="right-panel">
    <a routerLink="/" class="back-link">← Powrót do strony głównej</a>
    <h2>Zaloguj się</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="outline" class="full mat-field">
        <mat-label>Adres email</mat-label>
        <input matInput formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full mat-field">
        <mat-label>Hasło</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>


      <div class="row-between">
        <mat-checkbox formControlName="remember">Zapamiętaj mnie</mat-checkbox>
        <a class="forgot" routerLink="/forgot">Zapomniałeś hasła?</a>
      </div>

      <button mat-raised-button color="primary" class="full main-btn" [disabled]="loginForm.invalid">Zaloguj się</button>

      <div class="divider">lub</div>

      <div class="social-row">
        <button mat-stroked-button class="social-btn full">Google</button>
        <button mat-stroked-button class="social-btn full">Facebook</button>
      </div>

      <p class="bottom-text">
        Nie masz konta?
        <a routerLink="/register">Zarejestruj się</a>
      </p>
    </form>
  </div>
</div>
