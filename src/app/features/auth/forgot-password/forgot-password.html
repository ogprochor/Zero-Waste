<div class="auth-simple-container">
  <div class="card">
    <a routerLink="/login" class="back-link">← Powrót do logowania</a>
    <h2>Zapomniałeś hasła?</h2>
    <p>Podaj adres email. Jeśli konto istnieje, backend wygeneruje link do resetu.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Adres email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <button mat-raised-button color="primary" class="full" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Wysyłanie...' : 'Wyślij link resetujący' }}
      </button>
    </form>
  </div>
</div>
