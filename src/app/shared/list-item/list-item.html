<article class="list-item">
  <img
    *ngIf="item.imageUrl; else placeholder"
    [src]="item.imageUrl"
    alt="Zdjęcie {{ item.name }}"
    class="list-item__image"
  />

  <ng-template #placeholder>
    <img
      src="/assets/placeholder.png"
      alt="Brak zdjęcia"
      class="list-item__image"
    />
  </ng-template>

  <div class="list-item__content">
    <h3 class="list-item__name">{{ item.name }}</h3>
    <p class="list-item__description">{{ item.description }}</p>
  </div>
</article>
