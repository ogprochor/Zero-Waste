<div class="chat-window" *ngIf="isOpen$ | async">
  <div class="chat-header">
    <span>Czat: <strong>{{ sellerName$ | async }}</strong></span>
    <button (click)="close()" class="close-btn">×</button>
  </div>
  
  <div class="chat-body">
    <div *ngFor="let msg of messages" [ngClass]="{'msg-self': msg.self, 'msg-other': !msg.self}">
      {{ msg.text }}
    </div>
    <div class="placeholder-text" *ngIf="messages.length === 0">
      Napisz pierwszą wiadomość...
    </div>
  </div>

  <div class="chat-footer">
    <input type="text" [(ngModel)]="message" (keyup.enter)="sendMessage()" placeholder="Wpisz wiadomość...">
    <button (click)="sendMessage()">➤</button>
  </div>
</div>
